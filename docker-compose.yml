name: safety-portal

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://portal:${POSTGRES_PASSWORD}@db:5432/portal
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SETUP_KEY: ${SETUP_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FILES_DIR: /data/files
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      REMEMBER_ME_TTL_DAYS: ${REMEMBER_ME_TTL_DAYS:-30}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-240}
    volumes:
      - files-data:/data/files

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3960}:80"

volumes:
  db-data:
  files-data:
